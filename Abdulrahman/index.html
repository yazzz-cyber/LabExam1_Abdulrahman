<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Identity Cipher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Header -->
            <header class="header">
                <h1>🔐 Student Identity Cipher</h1>
                <p class="subtitle">Encrypt & Decrypt your student information with Caesar Cipher</p>
            </header>

            <!-- Input Section -->
            <section class="input-section">
                <h2>Student Information</h2>
                
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        placeholder="e.g., Jayson Tatum"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="yearLevel">Year Level *</label>
                    <select 
                        id="yearLevel"
                        autocomplete="off"
                    >
                        <option value="">Select Year Level</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="course">Course *</label>
                    <input 
                        type="text" 
                        id="course" 
                        placeholder="e.g., BSIT, BSCS"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="keyN">Shift Key (N) *</label>
                    <input 
                        type="number" 
                        id="keyN" 
                        min="1" 
                        max="25" 
                        placeholder="1 - 25"
                    >
                    <small class="hint">Caesar Cipher uses numbers 1-25 to shift letters</small>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="error-message"></div>
            </section>

            <!-- Button Section -->
            <section class="button-section">
                <button id="encryptBtn" class="btn btn-encrypt">🔒 Encrypt</button>
                <button id="decryptBtn" class="btn btn-decrypt">🔓 Decrypt</button>
                <button id="clearBtn" class="btn btn-clear">🗑️ Clear</button>
            </section>

            <!-- Output Section -->
            <section class="output-section">
                <div class="output-box">
                    <h3>Original Text</h3>
                    <div id="plaintextOutput" class="output-content">
                        <p class="placeholder">Plaintext will appear here...</p>
                    </div>
                </div>

                <div class="output-box">
                    <h3>Result</h3>
                    <div id="resultOutput" class="output-content">
                        <p class="placeholder">Result will appear here...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
